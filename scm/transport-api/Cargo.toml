[package]
name = "edge-transport-http-egress-transport-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "HTTP egress transport contract: request/response types, outbound traits, errors, config and the factory contract"
keywords = ["gateway", "egress", "http", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "transport"

[package.metadata.arch]
application_type = "lib"
service_type = "transport"

[lib]
path = "main/src/lib.rs"

[dependencies]
edge-security-runtime = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.41" }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = "1.0"
thiserror            = "2"
futures              = "0.3"
http                 = "1"
tokio                = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }
# The factory contract names reqwest's client types; no reqwest implementation is used here.
reqwest              = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware   = { version = "0.4", features = ["json", "multipart"] }
async-trait          = "0.1"
swe-observ-metrics   = { package = "swe-observability-metrics", git = "https://github.com/sweengineeringlabs/observability.git", tag = "v0.2.11" }
configbuilder = "0.8"

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
