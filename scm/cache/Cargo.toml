[package]
name = "edge-transport-http-egress-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "TTL-based HTTP cache middleware with configurable default_ttl_seconds + RFC 7234 Cache-Control honor. Simpler than full RFC 7234 (no Vary, no ETag conditional revalidation)."
keywords = ["http", "cache", "reqwest", "middleware", "swe"]
categories = ["web-programming::http-client"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[lib]
path = "main/src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
http = "1"
moka = { version = "0.12", features = ["future"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# `from_config` loads policy from TOML. `serde` derives the
# schema; `toml` parses it. Policy values live in
# `config/default.toml` + consumer overrides — never as hardcoded
# literals in source.
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }
tracing = { version = "0.1", default-features = false, optional = true }
# `tokio::spawn` fires the stale-while-revalidate background
# refresh task. Only `rt` is needed at runtime — the caller's
# runtime (tokio itself, typically) executes the spawned future.
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "macros", "rt-multi-thread"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }
http = "1"


[features]
default = []
# Emit spans via the `tracing` crate. Off by default so consumers
# without tracing infrastructure don't pay the cost.
tracing = ["dep:tracing"]


[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
