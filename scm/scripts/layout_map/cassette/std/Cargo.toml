[package]
name = "edge-transport-http-egress-cassette-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard record/replay middleware: VCR-style fixtures for deterministic e2e tests on reqwest-middleware clients"
keywords = ["http", "cassette", "reqwest", "middleware", "swe"]
categories = ["web-programming::http-client"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[lib]
path = "main/src/lib.rs"

[dependencies]
edge-transport-http-egress-cassette-api = { path = "../cassette-api" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
http = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.27"
configbuilder = "0.8"
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }
# Declared before the split and read by no code; kept so a consumer that enables it still resolves.
tracing = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "macros", "rt-multi-thread"] }
tempfile = "3"

[features]
default = []
# Inert: no code is gated on it (kept for consumers that enable it).
tracing = ["dep:tracing"]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
