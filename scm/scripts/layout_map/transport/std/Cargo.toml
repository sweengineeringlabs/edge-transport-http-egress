[package]
name = "edge-transport-http-egress-transport-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard HTTP egress transport: reqwest-backed HttpEgress and HttpStream with optional WebSocket support"
keywords = ["gateway", "egress", "http", "reqwest", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "transport"

[package.metadata.arch]
application_type = "lib"
service_type = "transport"

[lib]
path = "main/src/lib.rs"

# `websocket` is the only feature: it pulls in tokio-tungstenite for the SSE/WebSocket streaming
# surface. No default features.
[features]
websocket = ["dep:tokio-tungstenite"]

[dependencies]
edge-transport-http-egress-transport-api = { path = "../transport-api" }
serde_json           = "1.0"
futures              = "0.3"
http                 = "1"
tokio                = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }
reqwest              = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware   = { version = "0.4", features = ["json", "multipart"] }
async-trait          = "0.1"
bytes                = "1"
swe-observ-metrics   = { package = "swe-observability-metrics", git = "https://github.com/sweengineeringlabs/observability.git", tag = "v0.2.11" }
tokio-tungstenite    = { version = "0.26", optional = true, features = ["rustls-tls-native-roots"] }
configbuilder = "0.8"

[dev-dependencies]
tokio               = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "rt-multi-thread", "macros"] }
hyper               = { version = "1", features = ["http1", "server"] }
hyper-util          = { version = "0.1", features = ["tokio"] }
http-body-util      = "0.1"
tokio-tungstenite   = { version = "0.26", features = ["rustls-tls-native-roots"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
