[package]
name = "edge-transport-http-egress-cache-std"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Standard HTTP-cache middleware: a moka-backed response cache with stale-while-revalidate for reqwest-middleware clients"
keywords = ["http", "cache", "reqwest", "middleware", "swe"]
categories = ["web-programming::http-client"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "processor"

[package.metadata.arch]
application_type = "lib"
service_type = "processor"

[lib]
path = "main/src/lib.rs"

[dependencies]
edge-transport-http-egress-cache-api = { path = "../cache-api" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
http = "1"
moka = { version = "0.12", features = ["future"] }
anyhow = "1"
async-trait = "0.1"
configbuilder = "0.8"
tracing = { version = "0.1", default-features = false, optional = true }
# `tokio::spawn` fires the stale-while-revalidate background
# refresh task. Only `rt` is needed at runtime: the caller runtime
# (tokio itself, typically) executes the spawned future.
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "macros", "rt-multi-thread"] }

[features]
default = []
# Emit spans via the `tracing` crate. Off by default so consumers
# without tracing infrastructure do not pay the cost.
tracing = ["dep:tracing"]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
