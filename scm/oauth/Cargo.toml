[package]
name         = "edge-transport-http-egress-oauth"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "OAuth2 token-refresh middleware for edge egress — abstract OAuthTokenSource trait and reqwest-middleware shell."
keywords     = ["oauth", "auth", "reqwest", "middleware", "swe"]
categories   = ["web-programming::http-client", "authentication"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "processor"

[package.metadata.arch]
application_type = "lib"
service_type     = "processor"

[lib]
path = "main/src/lib.rs"

[dependencies]
async-trait        = "0.1"
anyhow             = "1"
futures            = "0.3"
reqwest            = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
http               = "1"
reqwest-middleware  = { version = "0.3", features = ["json", "multipart"] }
thiserror          = "2"
tokio                        = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }
tracing            = { version = "0.1", default-features = false }
serde              = { version = "1.0", features = ["derive"] }
toml               = "0.8"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "macros"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }
futures = "0.3"
reqwest-middleware = { version = "0.3", features = ["json", "multipart"] }


[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
