[package]
name         = "edge-transport-http-egress-transport"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "edge — egress HTTP outbound domain: request/response types, outbound trait, and default reqwest-backed implementation."
keywords     = ["gateway", "egress", "http", "sea", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "transport"

[package.metadata.arch]
application_type = "lib"
service_type     = "transport"

[lib]
path = "main/src/lib.rs"

# Each egress middleware is an opt-in cargo feature (ADR-006 Phase 2c). `default`
# enables all of them, so the out-of-the-box experience is unchanged; size-conscious
# consumers use `default-features = false` and enable only what they need.
[features]
default = ["auth", "oauth", "tls", "retry", "rate", "breaker", "cache", "cassette"]
auth     = ["dep:edge-security-transport-egress-http"]
# oauth/tls stay on the local crates: edge-security's own oauth/tls crates
# inherit their workspace's stale reqwest 0.11 / reqwest-middleware 0.2 pins
# (bearer independently pins reqwest 0.12, so it doesn't have this problem) —
# see edge-security#<pending> filed 2026-07-16.
oauth    = ["dep:edge-transport-http-egress-oauth"]
tls      = ["dep:edge-transport-http-egress-tls"]
retry    = ["dep:edge-transport-http-egress-retry"]
rate     = ["dep:edge-transport-http-egress-rate"]
breaker  = ["dep:edge-transport-http-egress-breaker"]
cache    = ["dep:edge-transport-http-egress-cache"]
cassette = ["dep:edge-transport-http-egress-cassette"]
websocket = ["dep:tokio-tungstenite"]

[dependencies]
edge-application     = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.16.0", features = ["security"] }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = "1.0"
thiserror            = "2"
futures              = "0.3"
http                 = "1"
tokio                = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }
reqwest              = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware   = { version = "0.3", features = ["json", "multipart"] }
# BYOSec reversed (2026-07-16): auth now depends on edge-security's bearer
# crate instead of a hand-rolled local implementation. oauth/tls stay local
# for now (see feature-flag comment above).
edge-security-transport-egress-http      = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.16", optional = true }
edge-transport-http-egress-oauth    = { path = "../oauth", optional = true }
edge-transport-http-egress-tls      = { path = "../tls", optional = true }
edge-transport-http-egress-retry    = { path = "../retry", optional = true }
edge-transport-http-egress-rate     = { path = "../rate", optional = true }
edge-transport-http-egress-breaker  = { path = "../breaker", optional = true }
edge-transport-http-egress-cache    = { path = "../cache", optional = true }
edge-transport-http-egress-cassette = { path = "../cassette", optional = true }
async-trait          = "0.1"
bytes                = "1"
swe-observ-metrics   = { package = "swe-observability-metrics", git = "ssh://git@github.com/sweengineeringlabs/observability.git", tag = "v0.2.9" }
tokio-tungstenite    = { version = "0.26", optional = true, features = ["rustls-tls-native-roots"] }
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

# Integration tests live in tests/*.rs and are auto-discovered by Cargo — one
# test target per file, named after the file stem. No explicit [[test]] entries
# are needed (and listing them risks silently omitting newly-added test files).

[dev-dependencies]
edge-application    = { git = "https://github.com/sweengineeringlabs/edge-application.git", tag = "v0.16.0", features = ["security"] }
tokio               = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "rt-multi-thread", "macros"] }
hyper               = { version = "1", features = ["http1", "server"] }
hyper-util          = { version = "0.1", features = ["tokio"] }
http-body-util      = "0.1"
bytes               = "1"
serde_json          = "1.0"
http                    = "1"
reqwest-middleware      = { version = "0.3", features = ["json", "multipart"] }
edge-security-transport-egress-http      = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.16" }
edge-security-runtime-credential = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.16" }
edge-security-runtime            = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.16" }
edge-transport-http-egress-oauth   = { path = "../oauth" }
edge-transport-http-egress-tls     = { path = "../tls" }
edge-transport-http-egress-retry   = { path = "../retry" }
edge-transport-http-egress-rate    = { path = "../rate" }
edge-transport-http-egress-breaker = { path = "../breaker" }
edge-transport-http-egress-cache   = { path = "../cache" }
edge-transport-http-egress-cassette = { path = "../cassette" }
async-trait              = "0.1"
futures                  = "0.3"
tokio-tungstenite        = { version = "0.26", features = ["rustls-tls-native-roots"] }
tempfile                 = "3"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
