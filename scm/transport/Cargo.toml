[package]
name         = "edge-transport-http-egress-transport"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
authors.workspace      = true
repository.workspace   = true
description  = "edge — egress HTTP outbound domain: request/response types, outbound trait, and default reqwest-backed implementation."
keywords     = ["gateway", "egress", "http", "sea", "swe"]
categories   = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "transport"

[package.metadata.arch]
application_type = "lib"
service_type     = "transport"

[lib]
path = "main/src/lib.rs"

# `transport` is a bare HTTP primitive: retry/rate/breaker/cache/cassette and auth/oauth/tls are the
# composition root's concern (ADR-005/006, edge-transport-http-egress#28), not opt-in features here.
# `websocket` is the only feature — it pulls in tokio-tungstenite for the SSE/WebSocket streaming
# surface. No default features.
[features]
websocket = ["dep:tokio-tungstenite"]

[dependencies]
edge-security-runtime = { git = "https://github.com/sweengineeringlabs/edge-security.git", tag = "v0.3.41" }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = "1.0"
thiserror            = "2"
futures              = "0.3"
http                 = "1"
tokio                = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time"] }
reqwest              = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
reqwest-middleware   = { version = "0.4", features = ["json", "multipart"] }
async-trait          = "0.1"
bytes                = "1"
swe-observ-metrics   = { package = "swe-observability-metrics", git = "ssh://git@github.com/sweengineeringlabs/observability.git", tag = "v0.2.11" }
tokio-tungstenite    = { version = "0.26", optional = true, features = ["rustls-tls-native-roots"] }
configbuilder = "0.8"

# Integration tests live in tests/*.rs and are auto-discovered by Cargo — one
# test target per file, named after the file stem. No explicit [[test]] entries
# are needed (and listing them risks silently omitting newly-added test files).

[dev-dependencies]
tokio               = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "rt-multi-thread", "macros"] }
hyper               = { version = "1", features = ["http1", "server"] }
hyper-util          = { version = "0.1", features = ["tokio"] }
http-body-util      = "0.1"
tokio-tungstenite        = { version = "0.26", features = ["rustls-tls-native-roots"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
