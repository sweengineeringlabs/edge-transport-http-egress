[package]
name = "edge-transport-http-egress-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Client-side mTLS identity for reqwest — loads PKCS12 or PEM certificates and attaches them to a reqwest::ClientBuilder. Sibling crate to edge_transport_http_egress_auth (architectural split: TLS handshake layer, not HTTP middleware)."
keywords = ["http", "tls", "mtls", "reqwest", "identity"]
categories = ["web-programming::http-client", "authentication"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "provider"

[package.metadata.arch]
application_type = "lib"
service_type = "provider"

[lib]
path = "main/src/lib.rs"

[dependencies]
# native-tls backend — required for reqwest::Identity from PKCS12
# or PEM. Consumers choose the backend; native-tls is the most
# portable default (uses system's TLS stack: SChannel on Windows,
# Security.framework on macOS, OpenSSL on Linux).
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls", "native-tls"], default-features = false }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
secrecy = "0.10"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }
tracing = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "sync", "fs", "io-util", "net", "time", "macros", "rt-multi-thread"] }
tempfile = "3"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.3.0" }

[features]
default = []
tracing = ["dep:tracing"]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
