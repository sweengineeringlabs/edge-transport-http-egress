[workspace]
resolver = "2"
members  = [
  "breaker",
  "cache",
  "cassette",
  "rate",
  "retry",
  "transport",
]

[workspace.package]
version      = "0.4.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-transport-http-egress"

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
