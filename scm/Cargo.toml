[workspace]
resolver = "2"
members  = [
  "breaker-api",
  "breaker-std",
  "cache-api",
  "cache-std",
  "cassette-api",
  "cassette-std",
  "rate-api",
  "rate-std",
  "resilient",
  "resilient-port",
  "retry-api",
  "retry-std",
  "transport-api",
  "transport-std",
]

[workspace.package]
version      = "0.6.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-transport-http-egress"

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
